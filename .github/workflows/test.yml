# sitaro-engine tests: on every push and pull request to main.
# Type-checks the "chart" Edge Function and runs the T4 test against Jagannatha Hora.
# tests/online_check.ts calls the live function and is not run here. Nothing is deployed.

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check
        run: deno check supabase/functions/chart/index.ts

      - name: Engine tests
        run: deno task test
